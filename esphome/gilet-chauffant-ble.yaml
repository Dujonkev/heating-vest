# ESP32 émetteur BLE pour l'intégration « Gilet chauffant (HEATING VEST) ».
# Il expose à Home Assistant l'action  esphome.gilet_chauffant_ble_send_adv
# qui diffuse une annonce BLE brute pendant duration_ms millisecondes.
# Utiliser un ESP32 dédié (pas un proxy Bluetooth) pour ne pas perturber le scan.

substitutions:
  name: gilet-chauffant-ble
  friendly_name: Gilet chauffant BLE

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: send_adv
      variables:
        data: string        # annonce brute en hexadécimal (31 octets max)
        duration_ms: int    # durée de diffusion
      then:
        - script.stop: adv_script
        - script.execute:
            id: adv_script
            data: !lambda return data;
            duration_ms: !lambda return duration_ms;

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

# Initialise la pile Bluetooth (aucun scan : l'ESP32 ne fait qu'émettre)
esp32_ble:

script:
  - id: adv_script
    mode: restart
    parameters:
      data: string
      duration_ms: int
    then:
      - lambda: |-
          std::vector<uint8_t> raw;
          for (size_t i = 0; i + 1 < data.size() && raw.size() < 31; i += 2) {
            raw.push_back((uint8_t) strtol(data.substr(i, 2).c_str(), nullptr, 16));
          }
          if (raw.empty()) {
            ESP_LOGW("gilet", "Annonce vide, ignorée");
            return;
          }
          static esp_ble_adv_params_t params = {};
          params.adv_int_min = 0x20;  // 20 ms
          params.adv_int_max = 0x30;  // 30 ms
          params.adv_type = ADV_TYPE_NONCONN_IND;
          params.own_addr_type = BLE_ADDR_TYPE_PUBLIC;
          params.channel_map = ADV_CHNL_ALL;
          params.adv_filter_policy = ADV_FILTER_ALLOW_SCAN_ANY_CON_ANY;
          esp_ble_gap_stop_advertising();
          esp_ble_gap_config_adv_data_raw(raw.data(), raw.size());
          esp_ble_gap_start_advertising(&params);
          ESP_LOGI("gilet", "Diffusion de %u octets : %s", (unsigned) raw.size(), data.c_str());
      - delay: !lambda return duration_ms;
      - lambda: |-
          esp_ble_gap_stop_advertising();
          ESP_LOGD("gilet", "Fin de diffusion");

sensor:
  - platform: wifi_signal
    name: Signal Wi-Fi
    update_interval: 120s
